apiVersion: v1
kind: Pod
metadata:
  labels:
    run: config-demo
  name: config-demo
  namespace: workloads
spec:
  containers:
  - command:
    - sleep
    - "3600"
    image: busybox:1.37
    name: config-dem
    envFrom:
        - configMapRef:
            name: app-settings
        - secretRef:
            name: app-credentials
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
