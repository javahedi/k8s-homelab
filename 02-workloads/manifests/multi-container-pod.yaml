apiVersion: v1
kind: Pod
metadata:
  name: nginx-pair
  namespace: workloads
  labels:
    app: nginx-pair
spec:
  containers:
    - name: nginx
      image: nginx:stable
      volumeMounts:
        - name: shared-data
          mountPath: /shared
    - name: observer
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          while true; do
            date
            wget -q -O - http://localhost:80
            sleep 5
          done
      volumeMounts:
        - name: shared-data
          mountPath: /shared
  volumes:
    - name: shared-data
      emptyDir: {}
