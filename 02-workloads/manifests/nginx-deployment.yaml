apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  namespace: workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-deploy
  template:
    metadata:
      labels:
        app: nginx-deploy
        environment: lab
    spec:
      containers:
        - name: nginx
          image: nginx:stable
