apiVersion: v1
kind: Pod
metadata:
  name: placement-demo
  namespace: workloads
  labels:
    run: placement-demo
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - worker2
  tolerations:
      - key: training
        operator: Equal
        value: reserved
        effect: NoSchedule
  containers:
    - name: placement-demo
      image: nginx:stable
  dnsPolicy: ClusterFirst
  restartPolicy: Always
