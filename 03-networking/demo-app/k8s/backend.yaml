apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jobs-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs-backend
  template:
    metadata:
      labels:
        app: jobs-backend
    spec:
      containers:
        - name: backend
          image: docker.io/library/javad-jobs-backend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
