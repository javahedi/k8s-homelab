apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobs
  namespace: jobs-demo
spec:
  ingressClassName: traefik
  rules:
  - host: jobs.lab
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 80
        path: /
        pathType: Prefix
      - backend:
          service:
            name: backend
            port:
              number: 8000
        path: /api
        pathType: Prefix
status:
  loadBalancer: {}
