# Small, temporary homelab installation.
alertmanager:
  enabled: false


grafana:
  enabled: true

  nodeSelector:
    kubernetes.io/hostname: worker2

  deploymentStrategy:
    type: Recreate
    rollingUpdate: null

  persistence:
    enabled: false

  livenessProbe:
    initialDelaySeconds: 300

  readinessProbe:
    timeoutSeconds: 5

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi


prometheus:
  prometheusSpec:
    replicas: 1
    retention: 6h
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
